# Builds the DocC documentation and the Kivy → NucleantUI playground and
# publishes them to GitHub Pages at https://nucleantui.github.io/NucleantUI/.
#
# Needs Settings → Pages → Source set to "GitHub Actions".
name: Documentation

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SWIFT_TOOLCHAIN: "6.3.3"
  WASM_SDK_URL: https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz
  WASM_SDK_CHECKSUM: cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The playground is built for WebAssembly, which needs a swift.org
      # toolchain and its matching SDK; the docs themselves use Xcode's.
      - name: Install the WebAssembly toolchain
        run: |
          curl -sSLO https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup --assume-yes --skip-install
          ~/.swiftly/bin/swiftly install "$SWIFT_TOOLCHAIN"
          ~/.swiftly/bin/swiftly run swift sdk install "$WASM_SDK_URL" --checksum "$WASM_SDK_CHECKSUM" "+$SWIFT_TOOLCHAIN"

      - name: Build the documentation site
        run: Scripts/build-docs.sh .build/docs-site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
